<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link
  rel="preload"
  href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"
  as="style"
  onload="this.onload=null;this.rel='stylesheet'"
>
<noscript>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"
  >
</noscript>

<!-- Support for Font Awesome -->
<link
  rel="preload"
  href="{{ base_path }}/assets/css/fontawesome.css"
  as="style"
  onload="this.onload=null;this.rel='stylesheet'"
>
<noscript>
  <link
    rel="stylesheet"
    href="{{ base_path }}/assets/css/fontawesome.css"
  >
</noscript>

<!-- Website icon using avatar image -->
<link
  rel="icon"
  type="image/png"
  href="{{ '/images/favicon.png' | relative_url }}"
>

<link
  rel="apple-touch-icon"
  href="{{ '/images/favicon.png' | relative_url }}"
>

<!-- Browser theme color -->
<meta name="theme-color" content="#1f5fa9">

<!-- end custom head snippets -->
